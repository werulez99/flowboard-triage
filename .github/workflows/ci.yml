name: Core tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm test
      - name: Package pinned upstream and companion
        if: runner.os == 'Linux'
        run: npm run package
      - name: Real source adapter integration
        if: runner.os == 'Linux'
        run: |
          unzip -q vendor/anchabadze.solidity-flowboard-1.2.0.vsix -d upstream-fixture
          FLOWBOARD_EXTENSION_PATH="$PWD/upstream-fixture/extension" npm test
      - name: Real native renderer browser check
        if: runner.os == 'Linux'
        run: |
          python3 -m venv browser-test-env
          browser-test-env/bin/python -m pip install playwright
          browser-test-env/bin/python -m playwright install --with-deps chromium
          browser-test-env/bin/python scripts/quality_harness_test.py
          FLOWBOARD_EXTENSION_PATH="$PWD/upstream-fixture/extension" browser-test-env/bin/python scripts/native_visual_smoke.py --output /tmp/flowboard-triage-demo.png
          FLOWBOARD_EXTENSION_PATH="$PWD/upstream-fixture/extension" browser-test-env/bin/python scripts/workflow_browser.py --output /tmp/flowboard-triage-workflow.png
          FLOWBOARD_EXTENSION_PATH="$PWD/upstream-fixture/extension" browser-test-env/bin/python scripts/workflow_browser.py --complex --width 1366 --height 768 --output /tmp/flowboard-triage-complex.png
          FLOWBOARD_EXTENSION_PATH="$PWD/upstream-fixture/extension" browser-test-env/bin/python scripts/usability_browser.py --output-prefix /tmp/flowboard-triage-usability
          FLOWBOARD_EXTENSION_PATH="$PWD/upstream-fixture/extension" browser-test-env/bin/python scripts/native_walkthrough_browser.py --output /tmp/flowboard-triage-native-walkthrough
          FLOWBOARD_EXTENSION_PATH="$PWD/upstream-fixture/extension" browser-test-env/bin/python scripts/native_route_browser.py --output /tmp/flowboard-triage-native-route
          FLOWBOARD_EXTENSION_PATH="$PWD/upstream-fixture/extension" browser-test-env/bin/python scripts/mixed_preparation_browser.py --output /tmp/flowboard-triage-mixed-preparation
